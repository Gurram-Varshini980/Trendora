<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #fdfbfb, #ebedee);
    padding: 30px;
    text-align: center;
}

h1{
    color: #333;
    margin-bottom: 25px;
    font-size: 40px;
    text-shadow: 2px 2px 5px lightgray;
}

table{
    width: 85%;
    margin: auto;
    border-collapse: collapse;
    background-color: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
}

th{
    background-color: #4CAF50;
    color: white;
    font-size: 18px;
    padding: 15px;
}

td{
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

tr:hover{
    background-color: #f5f5f5;
    transition: 0.3s;
}

#subtotal,
#discount,
#finalAmount{
    margin-top: 20px;
    font-size: 24px;
}

#subtotal{
    color: #1e3a8a;
}

#discount{
    color: #dc2626;
}

#finalAmount{
    color: #15803d;
    font-size: 30px;
    font-weight: bold;
}

button{
    margin-top: 25px;
    padding: 12px 25px;
    background-color: crimson;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
    
}

button:hover{
    background-color: darkred;
    transform: scale(1.05);
}
.btnn
{
    display: inline-block;
    background-color: crimson;
    color:white;
    padding: 12px 25px;
    text-decoration:none;
    border-radius: 8px;


}
.btn{
    display: inline-block;
    background-color: #2563eb;
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 8px;
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 16px;
    transition: 0.3s;
}

.btn:hover{
    background-color: #1d4ed8;
    transform: scale(1.05);
}
img{
    max-width:100%;
    height:auto;
}

body{
    margin:0;
    padding:0;
}
</style>

</head>

<body>

<h1>Shopping Cart</h1>

<table id="cartTable">
<tr>
    <th>Product</th>
    <th>Quantity</th>
    <th>Price</th>
    <th>Total</th>
</tr>
</table>

<h3 id="subtotal"></h3>
<h3 id="discount"></h3>
<h2 id="finalAmount"></h2>

<button onclick="clearCart()">Clear Cart</button>
<a href="checkout.html" class="btnn">Proceed to checkOut</a>
<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let table =
document.getElementById("cartTable");

let subtotal = 0;

cart.forEach(item =>
{
    let total =
    item.price * item.quantity;

    subtotal += total;

    let row =
    table.insertRow();

    row.insertCell(0).innerHTML =
    item.name;

    row.insertCell(1).innerHTML =
    item.quantity;

    row.insertCell(2).innerHTML =
    "$" + item.price;

    row.insertCell(3).innerHTML =
    "$" + total;
});

let discount =
subtotal * 0.20;

let finalAmount =
subtotal - discount;

document.getElementById("subtotal").innerHTML =
"Total Before Discount : $" + subtotal;

document.getElementById("discount").innerHTML =
"Discount (20%) : $" + discount;

document.getElementById("finalAmount").innerHTML =
"Total After Discount : $" + finalAmount;

function clearCart()
{
    localStorage.removeItem("cart");
    location.reload();
}

</script>
<a href="Trendora.html" class="btn">Go back</a>

</body>
</html>
