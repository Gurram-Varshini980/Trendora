                <script>
function increase(btn)
{
    let qty = btn.previousElementSibling;

    qty.innerText =
    parseInt(qty.innerText) + 1;

    syncCart(btn);
}

function decrease(btn)
{
    let qty = btn.nextElementSibling;

    if(parseInt(qty.innerText) > 0)
    {
        qty.innerText =
        parseInt(qty.innerText) - 1;

        syncCart(btn);
    }
}
function syncCart(btn)
{
    let card = btn.closest(".product-card");

    let name =
    card.querySelector("h2").innerText;

    let price =
    Number(
        card.querySelector("p")
        .innerText.replace("$","")
    );

    let quantity =
    parseInt(
        card.querySelector(".quantity span")
        .innerText
    );

    let cart =
    JSON.parse(localStorage.getItem("cart"))
    || [];

    let item =
    cart.find(p => p.name === name);

    if(item)
    {
        if(quantity == 0)
        {
            cart =
            cart.filter(
                p => p.name !== name
            );
        }
        else
        {
            item.quantity = quantity;
        }

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );
    }
}
</script>
<script>
function addToCart(button)
{
    let card = button.closest(".product-card");

    let name =
    card.querySelector("h2").innerText;

    let price =
    card.querySelector("p").innerText
    .replace("$","")
    .trim();

    let quantity =
    parseInt(
        card.querySelector(".quantity span")
        .innerText
    );

    if(quantity <= 0)
    {
        alert("Select quantity first");
        return;
    }

    let cart =
    JSON.parse(localStorage.getItem("cart"))
    || [];

    let existing =
cart.find(item => item.name === name);

if(existing)
{
    existing.quantity = quantity;
}
else
{
    cart.push({
        name: name,
        price: Number(price),
        quantity: quantity
    });
}

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    alert("Product Added Successfully");
}
localStorage.setItem(
    "cart",
    JSON.stringify(cart)
);

document.getElementById(
    "cartButtonContainer"
).style.display = "block";

alert("Added to Cart Successfully");
</script>

<script>

window.onload = function()
{
    let cart =
    JSON.parse(localStorage.getItem("cart"))
    || [];

    let cards =
    document.querySelectorAll(".product-card");

    cards.forEach(card =>
    {
        let productName =
        card.querySelector("h2").innerText;

        let item =
        cart.find(
            p => p.name === productName
        );

        if(item)
        {
            card.querySelector(
                ".quantity span"
            ).innerText =
            item.quantity;
        }
    });
}
