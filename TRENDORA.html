<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>
    body {
    font-family: Algerian, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
    overflow-x: hidden;
}

    header {
        background-color: aqua;
        color: blue;
        padding: 20px 10px;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;

        flex-wrap: nowrap;
    }

    .logo-img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        flex-shrink: 0;
    }

    .title {
        font-size: 50px;
        font-weight: bold;
        white-space: nowrap;
    }

    nav {
        background-color: aliceblue;
        font-size: medium;
        padding: 5px;
    }

    nav a {
        color: blueviolet;
        text-decoration: none;
        padding: 10px 25px;
        display: inline-block;
    }

    nav a:hover {
        background-color: blanchedalmond;
        color: black;
    }

    .main-image {
    width: 100%;
    max-width: 1200px;
    height: auto;
    display: block;
    margin: 0 auto;
}
    }

    /* Mobile screen */
    @media (max-width: 600px) {

        header {
            gap: 5px;
            padding: 15px 5px;
        }

        .logo-img {
            width: 30px;
            height: 30px;
        }

        .title {
            font-size: 28px;
        }

        nav a {
            padding: 8px 10px;
            font-size: 14px;
        }
    }
    html, body {
    margin: 0;
    padding: 0;
}

.main-image {
    width: 100%;
    max-width: 1200px;
    height: auto;
    display: block;
    margin: 0 auto;
    vertical-align: top;
}
</style>


</head>

<body>


<header>
    <img class="logo-img" src="snak1.webp">
    <img class="logo-img" src="dress.webp">

    <span class="title">TRENDORA</span>

    <img class="logo-img" src="fur.jpeg">
    <img class="logo-img" src="snack.jpeg">
</header>

<nav>
    <a href="home_page.html">Home</a>
    <a href="Products_PageM.html">Products</a>
    <a href="About.html">About</a>
</nav>

<img class="main-image" src="main.png">


</body>
</html>
